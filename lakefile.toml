name = "MovingSofa"
defaultTargets = ["MovingSofa", "MovingSofaSubmission"]

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "c52a81811e4626d2e9769fe9b0c701168c211332"

[[require]]
name = "lean-pool"
git = "https://github.com/Vilin97/lean-pool.git"
rev = "bb74ee07fc23bc81358d75a9c40303e5e27fced8"

[[require]]
name = "jordan_pick"
git = "https://github.com/rkirov/jordan_pick.git"
rev = "b3c9b7cf7358bf81a077d78ad67e6e8247869ddd"

[[require]]
name = "GerverSofa"
path = "vendor/gerver-sofa"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc1"


[[lean_lib]]
name = "MovingSofa"

[[lean_lib]]
name = "MovingSofaSubmission"
globs = ["MovingSofaSubmission.+"]
